name: field_service_tracker
description: "Offline-first field service and maintenance management application built with Flutter, BLoC and SQLite."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  material_ui: ^1.11.0

  # State management & navigation
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  go_router: ^18.1.4

  # Persistence
  drift: ^2.35.4
  drift_flutter: ^0.3.1

  # Formatting & platform info
  intl: ^0.20.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  build_runner: ^2.16.1
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/inter/OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
