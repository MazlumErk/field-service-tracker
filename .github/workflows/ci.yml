name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the workflow only checks out code and runs checks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies (also generates localizations)
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Verify committed generated files are up to date
        run: git diff --exit-code

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
